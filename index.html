    const sheetSelect = document.getElementById('sheetSelect');
    const columnSelect = document.getElementById('columnSelect');
    const valueSelect = document.getElementById('valueSelect');
    const searchInput = document.getElementById('searchInput');
    const tableHeader = document.getElementById('tableHeader');
    const tableBody = document.getElementById('tableBody');
    const statsInfo = document.getElementById('statsInfo');

    let currentSheetName = "";
    let currentData = [];
    let currentHeaders = [];

    // 初始化頁面
    function init() {
        sheetSelect.innerHTML = '';
        Object.keys(database).forEach(sheetName => {
            const option = document.createElement('option');
            option.value = sheetName;
            option.textContent = sheetName;
            sheetSelect.appendChild(option);
        });

        currentSheetName = Object.keys(database)[0];
        loadSheet(currentSheetName);
    }

    // 切換分類/工作表
    sheetSelect.addEventListener('change', function() {
        currentSheetName = this.value;
        loadSheet(currentSheetName);
    });

    function loadSheet(sheetName) {
        const sheetData = database[sheetName];
        currentHeaders = sheetData.headers;
        currentData = sheetData.rows;

        // 重置篩選下拉選單
        columnSelect.innerHTML = '<option value="">-- 全部欄位 --</option>';
        currentHeaders.forEach(header => {
            const option = document.createElement('option');
            option.value = header;
            option.textContent = header;
            columnSelect.appendChild(option);
        });

        valueSelect.innerHTML = '<option value="">-- 請先選擇欄位 --</option>';
        valueSelect.disabled = true;
        searchInput.value = '';

        applyFilters();
    }

    // 當選擇「欄位」變更時，動態提取該欄位的不重複值
    columnSelect.addEventListener('change', function() {
        const selectedCol = this.value;
        if (!selectedCol) {
            valueSelect.innerHTML = '<option value="">-- 全部條件 --</option>';
            valueSelect.disabled = true;
            applyFilters();
            return;
        }

        const uniqueValues = [...new Set(currentData.map(item => item[selectedCol]).filter(val => val !== undefined && val !== ''))];
        
        valueSelect.innerHTML = '<option value="">-- 全部 --</option>';
        uniqueValues.forEach(val => {
            const option = document.createElement('option');
            option.value = val;
            option.textContent = val;
            valueSelect.appendChild(option);
        });
        valueSelect.disabled = false;
        applyFilters();
    });

    valueSelect.addEventListener('change', applyFilters);
    searchInput.addEventListener('input', applyFilters);

    // 綜合過濾與渲染
    function applyFilters() {
        const selectedCol = columnSelect.value;
        const selectedVal = valueSelect.value;
        const keyword = searchInput.value.trim().toLowerCase();

        const filteredData = currentData.filter(row => {
            let matchCol = true;
            if (selectedCol && selectedVal) {
                matchCol = String(row[selectedCol]) === selectedVal;
            }

            let matchKey = true;
            if (keyword) {
                matchKey = Object.values(row).some(val => 
                    String(val).toLowerCase().includes(keyword)
                );
            }

            return matchCol && matchKey;
        });

        renderTable(filteredData, currentHeaders);
    }

    function renderTable(data, headers) {
        tableHeader.innerHTML = '';
        tableBody.innerHTML = '';

        headers.forEach(h => {
            const th = document.createElement('th');
            th.textContent = h;
            tableHeader.appendChild(th);
        });

        if (data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="${headers.length}" class="no-data">查無符合條件的數據</td></tr>`;
            statsInfo.textContent = '共 0 筆資料';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            headers.forEach(h => {
                const td = document.createElement('td');
                td.textContent = row[h] !== undefined ? row[h] : '';
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });

        statsInfo.textContent = `類別：${currentSheetName} | 共顯示 ${data.length} 筆資料`;
    }

    // 開啟頁面時執行初始化
    init();
</script>
